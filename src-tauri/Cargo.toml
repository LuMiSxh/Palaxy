[package]
name = "palaxy"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "The manga converter for the modern age"
repository = "https://github.com/LuMiSxh/Palaxy"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "palaxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
common.workspace = true
scanner.workspace = true
packager.workspace = true
# ---
tauri = { workspace = true, features = ["protocol-asset"] }
tauri-build = { version = "2.5", features = [] }
tauri-plugin-dialog = "2.4.2"
tauri-plugin-os = "2.3.2"
tauri-plugin-log = "2.7.1"
tauri-specta.workspace = true
# ---
specta.workspace = true
specta-typescript = "0.0.9"
serde.workspace = true
thiserror.workspace = true
# ---
tokio.workspace = true
async-trait = "0.1"
futures = "0.3.31"
# ---
image.workspace = true
ravif = "0.12"
# ---
epub-builder.workspace = true
zip.workspace = true
# ---
regex.workspace = true
lazy_static.workspace = true
rayon.workspace = true
num_cpus.workspace = true
log.workspace = true
once_cell = "1.21"
chrono = "0.4.42"
memmap2 = "0.9"
lru = "0.16"
# ---
mimalloc = "0.1"
tempfile.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.3"
