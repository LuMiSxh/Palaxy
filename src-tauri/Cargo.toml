[package]
name = "palaxy"
version = "0.3.2"
description = "The manga converter for the modern age"
authors = ["LuMiSxh"]
license = ""
repository = "https://github.com/LuMiSxh/Palaxy"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "palaxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2.0"
regex = "1.11"
image = { version = "0.25", features = ["avif"] }
lazy_static = { version = "1.5", features = [] }
tokio = { version = "1.44", features = ["fs"] }
epub-builder = "0.8"
zip = "2.5"
rayon = "1.10"
tauri-plugin-dialog = "2.2"
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
specta = "=2.0.0-rc.22"
tauri-plugin-os = "2"
memmap2 = "0.9"
num_cpus = "1.16.0"
tauri-plugin-log = "2"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite", "migrate"] }
once_cell = "1.21"
futures = "0.3.31"
log = "0.4"
chrono = "0.4.40"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
